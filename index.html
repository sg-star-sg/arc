const srch = {q:'',answer:'',busy:false,ctl:null,err:''};
const norm = s => s.toLowerCase().replace(/[^a-z0-9&%$ ]+/g,' ');
function findLessons(q){
  const words=norm(q).split(/\s+/).filter(w=>w.length>1).map(w=>w.replace(/(ies|es|s)$/,''));
  if(!words.length) return [];
  return Object.entries(LESSONS).map(([id,L])=>{
    const title=norm(L.title), body=norm(L.layers.slice(0,4).join(' '));
    let s=0; for(const w of words){ if(title.includes(w)) s+=3; if(body.includes(w)) s+=1 }
    if(title.includes(norm(q).trim())) s+=4;
    return [id,s];
  }).filter(x=>x[1]>=words.length).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
}
function lessonResults(q){
  const ids=findLessons(q);
  if(!q.trim()) return '';
  if(!ids.length) return `<p class="small">No lesson covers this yet.</p>`;
  return `<span class="eyebrow">In the lessons</span><div class="savelist" style="margin-top:10px">${ids.map(id=>{const L=LESSONS[id],m=mission(L.m);return `<button class="glass ${m.cls} capsule" data-lesson="${id}"><span><span class="k">${m.short} · ${L.mod}</span><span class="t">${L.title}</span></span><span class="arrow">${arrowSvg}</span></button>`}).join('')}</div>`;
}
function searchView(){
  const ex=['Treasury bonds','P/E ratio','Yield curve','Private credit','ETF vs mutual fund','Liquidation preference'];
  return `<section style="margin-top:20px"><h1>Search and ask</h1></section>
  <section style="margin-top:22px;max-width:760px">
    <form class="askform big" id="search-form" role="search">
      <label for="search-input" class="sr">A word or question</label>
      <input id="search-input" type="search" autocomplete="off" value="${esc(srch.q)}" placeholder="A term you read somewhere, or any question">
      <button type="submit" class="pill solid" id="search-go">${srch.busy?'Stop':sampleFn?'Explain':'Search'}</button>
    </form>
    ${srch.q?'':`<div class="chips" style="margin-top:14px">${ex.map(x=>`<button class="pill" data-srchex="${x}">${x}</button>`).join('')}</div>`}
    <div id="explain" style="margin-top:22px">${explainBlock()}</div>
    <div id="search-lessons" style="margin-top:22px">${lessonResults(srch.q)}</div>
  </section>`;
}
function explainBlock(){
  if(srch.busy&&!srch.answer) return `<div class="glass m-wealth ask"><div class="a thinking">Thinking…</div></div>`;
  if(srch.answer) return `<div class="glass m-wealth ask"><span class="eyebrow" style="color:rgba(238,241,246,.75)">${esc(srch.q)}</span><div class="a-wrap" id="explain-text">${cardsHTML(srch.answer,{done:!srch.busy}).html}</div>
    ${srch.busy?'':`<div class="chips"><button class="pill" data-srchex="Go one layer deeper on ${esc(srch.q)}">Go deeper</button><button class="pill" data-srchex="Give a real-world example of ${esc(srch.q)}">Real example</button><button class="pill" data-srchex="How does ${esc(srch.q)} affect my money?">What it means for me</button></div>`}</div>`;
  if(srch.err) return `<p class="small">${srch.err}</p>`;
  return '';
}
async function runSearch(q){
  q=q.trim(); if(!q) return;
  srch.q=q; srch.answer=''; srch.err='';
  if(!sampleFn){render();return}
  srch.busy=true; srch.ctl=new AbortController(); render();
  const prompt=`You explain finance, investing, banking, business and economics terms for a learning app. The reader may have no business background but wants real depth. They searched for: "${q}"

Whether it's a term or a question, explain it with depth. Teach how to evaluate; never tell the reader to buy or sell a specific investment. If facts may have changed recently, say so in WATCH.

${CARD_FORMAT}`;
  const paint=streamInto(()=>document.getElementById('explain-text'));
  try{
    const {text}=await sampleFn(prompt,{signal:srch.ctl.signal,modelTier:'default',onText:u=>{
      srch.answer=u.text; if(!document.getElementById('explain-text')){const box=document.getElementById('explain'); if(box) box.innerHTML=explainBlock()}
      paint(u);
    }});
    srch.answer=text;
  }catch(e){
    srch.answer=e?.text||'';
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e?.code)){sampleFn=null;srch.err='Explanations from Claude are off for this view. Matching lessons are below.'}
    else if(e?.code==='rate_limited') srch.err='Too many questions at once, or your Claude usage limit was reached. Try again shortly.';
    else if(e?.code==='refused') {srch.answer='';srch.err='Claude declined that one. Try wording it differently.'}
    else if(e?.code!=='cancelled') srch.err='The explanation was interrupted. Try again.';
  }finally{srch.busy=false;srch.ctl=null;if(state.view==='search')render()}
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='search-form') return; e.preventDefault();
  if(srch.busy){srch.ctl?.abort();return}
  runSearch(document.getElementById('search-input').value);
});
document.addEventListener('input',e=>{
  if(e.target.id!=='search-input') return;
  const box=document.getElementById('search-lessons'); if(box) box.innerHTML=lessonResults(e.target.value);
});

function modelFor(){
  const hz={short:0,mid:1,long:3,vlong:4}[horizon];
  const adj={sell:-2,hold:0,buy:1}[nerve];
  return ORDER[Math.max(0,Math.min(4,hz+adj))];
}

    </div>

      <div class="scen">${[['bull','Bull case','var(--low)'],['base','Base case','var(--med)'],['bear','Bear case','var(--vhigh)']].map(([k,n,c])=>`<div class="sn" style="--c:${c}"><b>${n}</b><p>${esc(str(d.scenarios?.[k]))}</p></div>`).join('')}</div>
      <p class="small" style="margin:12px 0 0">No one can predict a stock's return. Scenarios show what would have to happen for each outcome.</p>
    </div>
    <div class="ana-two">
      <div class="plain ana-card"><span class="lbl">What moves this stock</span><ul class="pc">${arr(d.drivers,4).map(x=>`<li>${esc(str(x))}</li>`).join('')}</ul>${d.history?`<p style="margin:10px 0 0;font-size:14px;color:rgba(238,241,246,.8)">${esc(str(d.history))}</p>`:''}</div>
      <div class="plain ana-card"><span class="lbl">Research next</span><ul class="pc">${arr(d.research_next,4).map(x=>`<li>${esc(str(x))}</li>`).join('')}</ul></div>
    </div>
    <p class="note">From Claude's general knowledge${d.knowledge_as_of?', current to about '+esc(str(d.knowledge_as_of)):''}. It does not see live prices or the latest results, so check the company's newest 10-K and earnings before deciding anything. Educational, not a recommendation.</p>
  </div>`;
}
async function runAnalysis(q){
  q=q.trim(); if(!q||!sampleFn) return;
  ana.q=q; ana.data=null; ana.err=''; ana.busy=true; ana.step=0; ana.ctl=new AbortController();
  clearInterval(ana.timer); ana.timer=setInterval(()=>{ana.step++;const o=document.getElementById('ana-out');if(o&&ana.busy)o.innerHTML=anaBody()},2600);
  render();
  const prompt=`You are an equity analyst teaching a smart beginner. Analyze the publicly traded company: "${q}".
Use only what you know with reasonable confidence; prefer leaving a field out or saying "unknown" over guessing. Never recommend buying or selling, and give no price targets.
Reply with only one JSON object, this shape:
{"found":true,"name":"","ticker":"","exchange":"","country":"","sector":"GICS sector","industry":"",
"what_it_does":"max 30 words","knowledge_as_of":"month and year your information is current to",
"risk":{"level":1-5,"label":"Low|Moderate|Elevated|High|Very high","why":"max 30 words"},
"segments":[{"name":"","share_pct":number or null if unsure,"note":"max 12 words"}],
"scorecard":[{"measure":"Revenue growth","rating":"strong|mixed|weak|unknown","note":"max 18 words"}, then the same for "Margins","Cash flow","Debt","Valuation","Competitive moat"],
"pros":["3-4 items, max 20 words each"],"cons":["3-4 items, max 20 words each"],
"drivers":["2-3 forces that move this stock, max 15 words each"],
"scenarios":{"bull":"what would drive strong returns, max 30 words","base":"max 30 words","bear":"what would drive losses, max 30 words"},
"history":"long-term track record, cycles and past big drawdowns you are confident about, max 35 words",
"research_next":["3 questions to check in the latest 10-K or earnings call"]}
If it is not a publicly traded company you recognise, reply {"found":false,"message":"one short sentence"}.`;
  try{ ana.data=await sampleFn.json(prompt,{signal:ana.ctl.signal,cache:{gcTime:3600000}}) }
  catch(e){
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e?.code)){sampleFn=null}
    else if(e?.code==='rate_limited') ana.err='Too many requests, or your Claude usage limit was reached. Try again shortly.';
    else if(e?.code==='invalid_json') ana.err='The analysis came back incomplete. Try again.';
    else if(e?.code==='refused') ana.err='Claude declined that one. Try the company\'s full name.';
    else if(e?.code!=='cancelled') ana.err='The analysis was interrupted. Try again.';
  }finally{ana.busy=false;ana.ctl=null;clearInterval(ana.timer);if(state.view==='invest')render()}
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='ana-form') return; e.preventDefault();
  if(ana.busy){ana.ctl?.abort();return}
  runAnalysis(document.getElementById('ana-input').value);
});

let libTab='saved';
function savedView(){
  const tabs=`<div class="tabs" role="tablist">${[['saved','Saved'],['notes','Notes'+(notes.length?' · '+notes.length:'')]].map(([k,n])=>`<button class="pill ${libTab===k?'on':''}" role="tab" aria-selected="${libTab===k}" data-libtab="${k}">${n}</button>`).join('')}</div>`;
  if(libTab==='notes') return `<section style="margin-top:20px"><h1>Library</h1>${tabs}</section>${notesList()}`;
  if(!saved.length) return `<section style="margin-top:20px"><h1>Library</h1>${tabs}</section><section style="margin-top:24px"><div class="glass m-legacy empty">
    <h1>Nothing saved yet.</h1>
    <p>Tap Save on any lesson or signal and it stays here, on this device.</p>
    <button class="pill solid" data-nav="learn" style="margin-top:8px">Browse lessons</button></div></section>`;
  const rows=saved.map(s=>{
    const [kind,id]=s.split(':');
    if(kind==='lesson'&&LESSONS[id]){const L=LESSONS[id],m=mission(L.m);return `<button class="glass ${m.cls} capsule" data-lesson="${id}"><span><span class="k">${m.short} · ${L.mod}</span><span class="t">${L.title}</span></span><span class="arrow">${arrowSvg}</span></button>`}
    if(kind==='sig'){const x=SIGNALS.find(y=>y.id===id); if(x){const m=mission(x.m)||MISSIONS[0];return `<button class="glass ${m.cls} capsule" data-signal="${esc(x.id)}"><span><span class="k">Signal · ${esc(x.date||'')}</span><span class="t">${esc(x.title)}</span></span><span class="arrow">${arrowSvg}</span></button>`} return ''}
    const n=NOW.find(x=>x.id===id); if(n){const m=mission(n.m);return `<button class="glass ${m.cls} capsule" data-nav="home"><span><span class="k">${n.kind}</span><span class="t">${n.title}</span></span><span class="arrow">${arrowSvg}</span></button>`}
    return '';
  }).join('');
  return `<section style="margin-top:20px"><h1>Library</h1>${tabs}</section>
  <section style="margin-top:24px"><div class="savelist">${rows}</div></section>`;
}

/* ---------- notes (kept on this device) ---------- */
let notes = store.get('notes',[]);
let noteQuery='', noteTimer=null, noteConfirm=null;
const saveNotes=()=>store.set('notes',notes);
const refLabel=r=>{if(!r)return '';const[k,id]=r.split(':');if(k==='lesson'&&LESSONS[id])return LESSONS[id].title;if(k==='sig'){const x=SIGNALS.find(y=>y.id===id);if(x)return x.title}return ''};
const noteTitle=n=>(n.title||'').trim()||(n.text||'').trim().split('\n')[0].slice(0,70)||'Untitled note';
const fmtDate=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function newNote(ref){
  const n={id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:'',text:'',ref:ref||'',created:new Date().toISOString(),updated:new Date().toISOString()};
  notes.unshift(n); saveNotes(); go('note',n.id);
}
function notesList(){
  const q=noteQuery.trim().toLowerCase();
  const list=notes.filter(n=>!q||(noteTitle(n)+' '+n.text+' '+refLabel(n.ref)).toLowerCase().includes(q)).sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));
  return `<section style="margin-top:22px;max-width:760px">
    <div class="note-bar">
      <button class="pill solid" data-newnote="">New note</button>
      ${notes.length?`<input id="note-search" type="search" placeholder="Search your notes" value="${esc(noteQuery)}" aria-label="Search your notes">`:''}
      ${notes.length?`<button class="pill" data-copynotes="1">Copy all</button>`:''}
    </div>
    <div class="savelist" id="note-list" style="margin-top:14px">${notesRows(list)}</div>
    <p class="note">Notes are kept on this device, in this browser. Use Copy all to keep a backup somewhere else.</p>
  </section>`;
}
function notesRows(list){
  if(!notes.length) return `<div class="glass m-create empty"><h2>Your thinking goes here.</h2><p>Write down ideas, questions and connections as you learn. You can also add a note straight from any lesson or signal.</p></div>`;
  if(!list.length) return `<p class="small">No notes match.</p>`;
  return list.map(n=>`<button class="plain noterow" data-opennote="${n.id}">
    <span class="k">${fmtDate(n.updated)}${n.ref&&refLabel(n.ref)?' · '+esc(refLabel(n.ref)):''}</span>
    <span class="t">${esc(noteTitle(n))}</span>
    ${n.text&&n.title?`<span class="pv">${esc(n.text.slice(0,140))}</span>`:''}
  </button>`).join('');
}
function noteView(id){
  const n=notes.find(x=>x.id===id);
  if(!n) return `<button class="back" data-nav="saved">← Notes</button><p class="small" style="margin-top:20px">This note was deleted.</p>`;
  const r=n.ref&&refLabel(n.ref); const [k,rid]=(n.ref||':').split(':');
  return `<button class="back" data-notesback="1">← Notes</button>
  <section class="glass m-create noteed">
    <div class="note-meta"><span class="eyebrow" style="color:rgba(238,241,246,.75)">Edited <span id="note-when">${fmtDate(n.updated)}</span></span>
      ${r?`<button class="pill" ${k==='lesson'?`data-lesson="${rid}"`:`data-signal="${esc(rid)}"`}>On: ${esc(r)}</button>`:''}</div>
    <label for="note-title" class="sr">Title</label>
    <input id="note-title" class="note-title" placeholder="Title" value="${esc(n.title)}">
    <label for="note-text" class="sr">Note</label>
    <textarea id="note-text" class="note-text" placeholder="What are you thinking? Questions, ideas, connections, what you'd do differently…">${esc(n.text)}</textarea>
    <div class="note-actions">
      <span class="small" id="note-status">Saved</span>
      ${noteConfirm===n.id
        ?`<span class="small">Delete this note?</span><button class="pill" data-delnote="${n.id}">Delete</button><button class="pill" data-canceldel="1">Keep</button>`
        :`<button class="pill" data-askdel="${n.id}">Delete</button>`}
    </div>
  </section>`;
}
function notesFor(ref){
  const list=notes.filter(n=>n.ref===ref);
  return `<section class="plain lesson-notes">
    <div class="sec-head" style="margin-bottom:8px"><h3>Your notes</h3><button class="pill solid" data-newnote="${esc(ref)}">Add a note</button></div>
    ${list.length?`<div class="savelist">${list.map(n=>`<button class="noterow inner" data-opennote="${n.id}"><span class="k">${fmtDate(n.updated)}</span><span class="t">${esc(noteTitle(n))}</span></button>`).join('')}</div>`:`<p class="small" style="margin:0">Jot down what clicked, what you'd ask next, or how it connects to something else.</p>`}
  </section>`;
}
document.addEventListener('input',e=>{
  if(e.target.id==='note-search'){noteQuery=e.target.value;const l=document.getElementById('note-list');if(l){const q=noteQuery.trim().toLowerCase();l.innerHTML=notesRows(notes.filter(n=>!q||(noteTitle(n)+' '+n.text+' '+refLabel(n.ref)).toLowerCase().includes(q)).sort((a,b)=>String(b.updated).localeCompare(String(a.updated))))}return}
  if(e.target.id!=='note-title'&&e.target.id!=='note-text') return;
  const n=notes.find(x=>x.id===state.param); if(!n) return;
  if(e.target.id==='note-title') n.title=e.target.value.slice(0,200); else n.text=e.target.value.slice(0,50000);
  const st=document.getElementById('note-status'); if(st) st.textContent='Saving…';
  clearTimeout(noteTimer); noteTimer=setTimeout(()=>{n.updated=new Date().toISOString();saveNotes();if(st)st.textContent='Saved';const w=document.getElementById('note-when');if(w)w.textContent=fmtDate(n.updated)},400);
});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-mission],[data-lesson],[data-save],[data-itab],[data-hz],[data-nv],[data-invest],[data-askchip],[data-srchex],[data-anaex],[data-mood],[data-fbagain],[data-fbrefresh],[data-fbcopy],[data-signal],[data-libtab],[data-newnote],[data-opennote],[data-askdel],[data-delnote],[data-canceldel],[data-notesback],[data-copynotes]'); if(!t) return;
  if(t.dataset.libtab){libTab=t.dataset.libtab;render();return}
  if(t.dataset.newnote!==undefined){newNote(t.dataset.newnote);setTimeout(()=>document.getElementById('note-text')?.focus(),50);return}
  if(t.dataset.opennote) return go('note',t.dataset.opennote);
  if(t.dataset.notesback){libTab='notes';return go('saved')}
  if(t.dataset.askdel){noteConfirm=t.dataset.askdel;render();return}
  if(t.dataset.canceldel){noteConfirm=null;render();return}
  if(t.dataset.delnote){notes=notes.filter(n=>n.id!==t.dataset.delnote);saveNotes();noteConfirm=null;libTab='notes';return go('saved')}
  if(t.dataset.copynotes){const txt=notes.map(n=>`${noteTitle(n)}\n${fmtDate(n.updated)}${refLabel(n.ref)?' · '+refLabel(n.ref):''}\n\n${n.text}`).join('\n\n———\n\n');
    (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>{t.textContent='Copied'}).catch(()=>{t.textContent='Copy not allowed here'});return}
  if(t.dataset.signal) return go('signal',t.dataset.signal);
  if(t.dataset.askchip){askQuestion(state.param,t.dataset.askchip);return}
  if(t.dataset.mood){const d=document.getElementById('fb-text')?.value||'';fb.mood=fb.mood===t.dataset.mood?'':t.dataset.mood;render();const x=document.getElementById('fb-text');if(x)x.value=d;return}
  if(t.dataset.fbagain){fb.sent=false;render();return}
  if(t.dataset.fbrefresh){fb.inbox=null;render();loadInbox();return}
  if(t.dataset.fbcopy){const txt=(fb.mood?'['+fb.mood+'] ':'')+(document.getElementById('fb-text')?.value||'');
    (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>{t.textContent='Copied'}).catch(()=>{const x=document.getElementById('fb-text');x?.focus();x?.select()});return}
  if(t.dataset.nav==='feedback'&&amOwner){go('feedback');loadInbox();return}
  if(t.dataset.anaex){if(!ana.busy)runAnalysis(t.dataset.anaex);return}
  if(t.dataset.srchex){if(srch.busy)return; if(state.view!=='search'){state={view:'search',param:null};window.scrollTo({top:0})} runSearch(t.dataset.srchex);return}
  if(t.dataset.save){toggleSave(t.dataset.save);render();return}
  if(t.dataset.itab){investTab=t.dataset.itab;render();return}
  if(t.dataset.hz){horizon=t.dataset.hz;store.set('horizon',horizon);render();return}
  if(t.dataset.nv){nerve=t.dataset.nv;store.set('nerve',nerve);render();return}
  if(t.dataset.invest){investTab=t.dataset.invest;return go('invest')}
  if(t.dataset.lesson) return go('lesson',t.dataset.lesson);
  if(t.dataset.mission) return go('mission',t.dataset.mission);
  if(t.dataset.nav) return go(t.dataset.nav);
});

loadContent();
document.getElementById('today').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
render();
</script>
