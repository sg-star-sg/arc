<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>ARC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Manrope:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: a dark instrument panel — glowing glass cards on a faint grid, a thin rail for lesson layers, floating pill nav */
:root{
  color-scheme:dark;
  --ink:#05070c;
  --panel:#0b0f18;
  --panel2:#111726;
  --text:#eef1f6;
  --muted:#8b93a7;
  --line:rgba(226,232,245,.09);
  --low:#5fd3b5;
  --med:#7fb0ff;
  --high:#ffb36b;
  --vhigh:#ff7a8a;
  --display:"EB Garamond",Garamond,"Times New Roman",serif;   /* headlines, section titles, statements */
  --body:"DM Sans","Helvetica Neue",Arial,sans-serif;          /* paragraphs, nav, buttons */
  --stat:"Manrope","Helvetica Neue",Arial,sans-serif;          /* stats, callouts, highlights */
  --mono:var(--stat);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--ink);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;background-position:-1px -1px;
  color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-inline:16px;padding-block:0 130px;
}
button,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:12px}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;padding-block:22px 8px}
.mark{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.18em;line-height:1}
header.top{gap:20px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.rule{flex:1;min-width:24px;display:flex;align-items:center;margin-right:8px}
.rule .line{flex:1;height:1.5px;border-radius:2px;background:linear-gradient(90deg,rgba(238,241,246,.9),rgba(238,241,246,.55));box-shadow:0 0 8px rgba(127,176,255,.8),0 0 2px rgba(127,176,255,.9);transform-origin:left}
.rule .dot{flex:none;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.14),0 0 14px rgba(255,255,255,.8)}
@media (prefers-reduced-motion:no-preference){
  .rule .line{animation:grow 1.1s cubic-bezier(.4,0,.2,1) both}
  .rule .dot{animation:pop .5s .9s cubic-bezier(.3,1.5,.6,1) both}
}
.date{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,6.6vw,66px);line-height:1.02;letter-spacing:-.015em}
h2{font-size:32px;line-height:1.1}
h3{font-size:23px;line-height:1.2}
.eyebrow{font-family:var(--stat);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:62ch;margin:10px 0 0}
section{margin-top:52px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:18px}
.small{font-size:13px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;max-width:80ch}
.note a{color:var(--muted)}

.glass{
  --c1:#2f6bff;--c2:#9cc1ff;
  position:relative;border-radius:34px;overflow:hidden;
  background:
    radial-gradient(120% 80% at 15% 0%,color-mix(in srgb,var(--c1) 55%,transparent),transparent 60%),
    radial-gradient(90% 70% at 100% 110%,color-mix(in srgb,var(--c2) 40%,transparent),transparent 65%),
    var(--panel);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 -50px 90px -50px var(--c2),0 30px 70px -40px var(--c1);
}
.m-wealth{--c1:#2f6bff;--c2:#7fb0ff}
.m-business{--c1:#ff7a1a;--c2:#ffcf94}
.m-economy{--c1:#13a99a;--c2:#8ef0df}
.m-world{--c1:#e8402f;--c2:#ffa58f}
.m-future{--c1:#7c4dff;--c2:#e7a2ff}
.m-legacy{--c1:#c98a3c;--c2:#fff0d4}
.m-create{--c1:#22b866;--c2:#b4f2c7}
.plain{border-radius:28px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}

.now-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;padding:28px}
.chart{min-width:0}
.chart svg{width:100%;height:auto;display:block}
.bignum{font-family:var(--stat);font-weight:200;font-size:clamp(64px,10vw,104px);line-height:.95;letter-spacing:-.02em}
.bignum sup{font-size:.3em;font-weight:300;vertical-align:top;margin-left:4px}
.now-hero p{margin:10px 0 0;color:rgba(238,241,246,.8);max-width:46ch}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-size:13px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:var(--text);white-space:nowrap}
.pill.solid{background:#fff;color:#0b0f18;box-shadow:none;font-weight:500}
.pill:hover{background:rgba(255,255,255,.13)}
.pill.solid:hover{background:#dfe6f3}
.pill.on{background:#fff;color:#0b0f18}
.src{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:14px;display:block}
.src a{color:var(--muted)}

.capsules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:16px}
.capsule{border-radius:999px;padding:20px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;width:100%}
.capsule .t{font-family:var(--display);font-size:22px;font-weight:400;line-height:1.15}
.capsule .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(238,241,246,.7);display:block;margin-bottom:4px}
.arrow{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.arrow svg{width:16px;height:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.mcard{min-height:240px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%;transition:transform .25s ease}
.mcard:hover{transform:translateY(-3px)}
.frac{font-family:var(--stat);font-weight:200;font-size:58px;line-height:1;letter-spacing:-.02em}
.frac em{font-style:normal;color:rgba(238,241,246,.45)}
.mcard .name{font-family:var(--display);font-size:25px;line-height:1.1;font-weight:400}
.mcard .sub{display:block;color:rgba(238,241,246,.62);font-size:14px;margin-top:4px}

.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-top:8px}
.back:hover{color:var(--text)}
.m-hero{padding:32px;margin-top:16px}
.m-hero p{color:rgba(238,241,246,.82);max-width:60ch;margin:12px 0 0}
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:20px}
.module{padding:22px}
.module h3{margin-bottom:8px}
.litem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-size:15px}
.litem:hover .lt{text-decoration:underline;text-underline-offset:4px}
.litem .lt{min-width:0}
.tag{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tag.read{color:#9ff0c0}
.dotmark{flex:none;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.14),0 0 12px rgba(255,255,255,.6)}

.lesson-head{padding:32px;margin-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px}
.lesson-head h1{max-width:20ch}
.save[aria-pressed="true"]{background:#fff;color:#0b0f18}
.rail{position:relative;margin:36px 0 0;padding-left:44px;max-width:720px}
.rail::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:1px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.08))}
.layer{position:relative;padding-bottom:30px}
.layer::before{content:"";position:absolute;left:-41px;top:4px;width:18px;height:18px;border-radius:50%;background:#0b0f18;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.layer.key p{font-family:var(--stat);font-weight:500;font-size:17px;line-height:1.5;color:var(--text)}
.layer.key::before{background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.14),0 0 22px rgba(255,255,255,.75)}
.layer .eyebrow{display:block;margin-bottom:6px}
.layer p{margin:0;max-width:62ch;color:rgba(238,241,246,.9)}
.layer ul{margin:6px 0 0;padding-left:18px;color:rgba(238,241,246,.9)}
.layer li{margin:4px 0}
.next{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px}
.ask{padding:26px;max-width:760px;display:flex;flex-direction:column;gap:14px}
.thread{display:flex;flex-direction:column;gap:14px}
.thread:empty{display:none}
.q{align-self:flex-end;max-width:85%;background:#fff;color:#0b0f18;border-radius:20px 20px 6px 20px;padding:10px 16px;font-size:15px}
.a{max-width:62ch;color:rgba(238,241,246,.92);font-size:15.5px}
.a p{margin:0 0 10px}.a ul{margin:0 0 10px;padding-left:18px}.a li{margin:4px 0}
.a.thinking{font-family:var(--stat);font-size:13px;letter-spacing:.06em;color:rgba(238,241,246,.7)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .pill{white-space:normal;text-align:left}
.askform{display:flex;gap:8px;align-items:flex-end;background:rgba(5,7,12,.55);border-radius:24px;padding:8px 8px 8px 16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.askform textarea{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:15px;resize:none;padding:8px 0;outline:none;field-sizing:content;max-height:160px}
.askform textarea::placeholder{color:rgba(238,241,246,.5)}
.askform:focus-within{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.askform input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:17px;padding:10px 0;outline:none}
.askform input::placeholder{color:rgba(238,241,246,.5)}
.askform.big{padding:8px 8px 8px 20px;align-items:center}
nav.dock .srch{display:grid;place-items:center;padding:10px 13px}
.a-wrap{width:100%}
.note-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note-bar input{flex:1;min-width:160px;background:rgba(255,255,255,.06);border:0;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--text);font:inherit;font-size:14px;padding:9px 16px;outline:none}
.noterow{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;padding:16px 20px}
.noterow .k{font-family:var(--stat);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.noterow .t{font-family:var(--display);font-size:22px;line-height:1.2}
.noterow .pv{font-size:14px;color:rgba(238,241,246,.7);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.noterow.inner{padding:12px 0;border-top:1px solid var(--line);border-radius:0}
.noterow:hover .t{text-decoration:underline;text-underline-offset:4px}
.noteed{margin-top:16px;padding:26px;display:flex;flex-direction:column;gap:12px;max-width:820px}
.note-meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.note-title{background:none;border:0;outline:none;color:var(--text);font-family:var(--display);font-size:clamp(28px,5vw,40px);padding:4px 0}
.note-title::placeholder,.note-text::placeholder{color:rgba(238,241,246,.4)}
.note-text{min-height:46vh;background:rgba(5,7,12,.45);border:0;border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:var(--text);font:inherit;font-size:16px;line-height:1.7;padding:18px 20px;resize:vertical;outline:none}
.note-text:focus{box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.note-actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.note-actions #note-status{margin-right:auto}
.lesson-notes{margin-top:16px;padding:22px;max-width:760px}
.fbtext{width:100%;background:rgba(5,7,12,.5);border:0;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:var(--text);font:inherit;font-size:15px;padding:14px 16px;resize:vertical;outline:none}
.fbtext:focus{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.fbtext::placeholder{color:rgba(238,241,246,.5)}
.fbrow{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.fbrow p{margin:0;white-space:pre-wrap}
.fbmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.fbmeta b{font-weight:500}
header.top .pill{padding:6px 12px;font-size:12.5px}
.ana{display:grid;gap:14px}
.ana-wait{padding:22px;display:flex;align-items:center;gap:14px;font-family:var(--stat);font-size:14px;color:rgba(238,241,246,.8)}
.ana-hero{padding:28px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.riskbox{background:rgba(5,7,12,.45);border-radius:24px;padding:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);display:flex;flex-direction:column;gap:8px}
.riskbox b{font-family:var(--stat);font-weight:500;font-size:20px}
.riskbox p{margin:0;font-size:14px;color:rgba(238,241,246,.8)}
.riskbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.riskbar i{height:10px;border-radius:999px;background:rgba(255,255,255,.12)}
.riskbar i.on{background:color-mix(in srgb,var(--low),var(--vhigh) calc((var(--k) - 1) * 25%));box-shadow:0 0 12px color-mix(in srgb,var(--low),var(--vhigh) calc((var(--k) - 1) * 25%))}
.ana-card{padding:22px;display:flex;flex-direction:column;gap:10px}
.ana-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.sc{display:grid;grid-template-columns:10px 1fr auto;gap:4px 10px;align-items:center;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.04)}
.sc .dot{width:9px;height:9px;border-radius:50%}
.sc b{font-weight:500;font-size:14.5px}
.sc .rt{font-family:var(--stat);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sc p{grid-column:2/4;margin:0;font-size:13.5px;color:rgba(238,241,246,.75)}
.pc{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.sn{padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--c) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.sn b{font-family:var(--stat);font-weight:500;color:var(--c)}
.sn p{margin:6px 0 0;font-size:14px}
@media (max-width:760px){.ana-hero{grid-template-columns:1fr;padding:22px}}
@media (prefers-reduced-motion:no-preference){.ana>*{animation:cardin .5s cubic-bezier(.2,.9,.3,1.2) both}.ana>:nth-child(2){animation-delay:80ms}.ana>:nth-child(3){animation-delay:160ms}.ana>:nth-child(4){animation-delay:240ms}.ana>:nth-child(n+5){animation-delay:320ms}.ana-wait .c-typing i{animation:pulse 1s ease-in-out infinite}}
.cards{display:grid;gap:14px}
.c-head{margin:0;font-family:var(--display);font-size:clamp(25px,4vw,33px);line-height:1.15;color:var(--text);text-wrap:balance}
.c-analogy{margin:0;font-family:var(--display);font-style:italic;font-size:20px;line-height:1.35;color:rgba(238,241,246,.85);border-left:1px solid rgba(255,255,255,.55);padding-left:14px}
.c-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.c-step{background:rgba(255,255,255,.06);border-radius:20px;padding:14px 16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.c-step .n{display:block;font-family:var(--stat);font-weight:200;font-size:30px;line-height:1;margin-bottom:8px}
.c-step p{margin:0;font-size:14.5px;line-height:1.45}
.c-stat{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.c-stat .big{font-family:var(--stat);font-weight:200;font-size:clamp(44px,8vw,64px);line-height:1;letter-spacing:-.02em}
.c-stat span:last-child{font-family:var(--stat);font-weight:500;font-size:14px;color:rgba(238,241,246,.8);max-width:34ch}
.c-why{background:rgba(255,255,255,.93);color:#0b0f18;border-radius:22px;padding:16px 20px}
.c-why p,.c-ex p{margin:4px 0 0;font-size:15.5px;line-height:1.5}
.c-why p{font-family:var(--stat);font-weight:500}
.c-why .lbl{color:#4a5165}
.lbl{font-family:var(--stat);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(238,241,246,.65)}
.c-ex{background:rgba(5,7,12,.5);border-radius:22px;padding:16px 20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.c-watch{margin:0;display:flex;gap:10px;font-size:14px;color:#ffd7a8}
.c-text{margin:0}
.c-typing{display:flex;gap:6px;padding:6px 2px}
.c-typing i{width:6px;height:6px;border-radius:50%;background:rgba(238,241,246,.7)}
@media (prefers-reduced-motion:no-preference){
  .enter{animation:cardin .5s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes cardin{from{opacity:0;transform:translateY(10px) scale(.98)}}
  .c-typing i{animation:pulse 1s ease-in-out infinite}
  .c-typing i:nth-child(2){animation-delay:.15s}.c-typing i:nth-child(3){animation-delay:.3s}
}
.ask-note{margin:0;font-size:12px;color:rgba(238,241,246,.6)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.a.thinking{animation:pulse 1.6s ease-in-out infinite}}

/* invest */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.ladder{display:grid;gap:22px}
.tier-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tier-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 12px currentColor;background:currentColor}
.t-low{color:var(--low)}.t-med{color:var(--med)}.t-high{color:var(--high)}.t-vhigh{color:var(--vhigh)}
.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.asset{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.asset h3{font-size:18px}
.asset p{margin:0;font-size:14px;color:rgba(238,241,246,.82)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--text);font-weight:400}
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;padding:28px}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.field label{font-size:14px;color:rgba(238,241,246,.85)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.bar{display:flex;height:22px;border-radius:999px;overflow:hidden;margin:6px 0 16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.bar span{display:block;height:100%}
.legend{display:grid;gap:8px}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:baseline;font-size:14px}
.lg i{width:10px;height:10px;border-radius:3px;display:block;transform:translateY(1px)}
.lg .pct{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lg small{grid-column:2/4;color:var(--muted);font-size:12.5px;margin-top:-4px}
.steps{display:grid;gap:10px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:14px 16px}
.steps li::before{content:counter(s);font-family:var(--stat);font-weight:200;font-size:28px;line-height:1}
.steps b{font-weight:500}
.steps p{margin:2px 0 0;font-size:14px;color:rgba(238,241,246,.8)}
.sector{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.sector p{margin:0;font-size:14px;color:rgba(238,241,246,.82)}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;box-shadow:inset 0 0 0 1px currentColor}
.theme{padding:22px;display:flex;flex-direction:column;gap:10px}
.theme p{margin:0;font-size:14px;color:rgba(238,241,246,.85)}
.cos{display:flex;flex-wrap:wrap;gap:6px}
.cos span{font-size:12.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08)}
.tablewrap{overflow-x:auto;border-radius:24px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400}
td:first-child{font-weight:500;white-space:nowrap}

/* world */
.country{padding:24px;display:flex;flex-direction:column;gap:12px}
.country.anchor{background:radial-gradient(120% 90% at 0% 0%,rgba(47,107,255,.35),transparent 60%),var(--panel);box-shadow:inset 0 0 0 1px rgba(127,176,255,.35)}
.country h3{font-size:28px}
.country p{margin:0;font-size:14.5px;color:rgba(238,241,246,.82)}
.timeline{position:relative;padding-left:28px;display:grid;gap:18px;max-width:760px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.55))}
.ev{position:relative}
.ev::before{content:"";position:absolute;left:-27px;top:7px;width:11px;height:11px;border-radius:50%;background:#0b0f18;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.ev.future::before{background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.14),0 0 18px rgba(255,255,255,.7)}
.ev .yr{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev p{margin:2px 0 0;max-width:64ch}

.empty{padding:36px}
.empty p{color:rgba(238,241,246,.82);max-width:52ch}
.savelist{display:grid;gap:12px}

.scrub.grab{cursor:grabbing}

  @keyframes pulse{50%{opacity:.55}}
  main{animation:rise .35s ease both}
  @keyframes rise{from{transform:translateY(8px);opacity:.4}}
  .draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.4,0,.2,1) both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .fadein{animation:fade 1.6s ease both}
  @keyframes fade{from{opacity:0}}
  .rdot{animation:pop .6s cubic-bezier(.3,1.5,.6,1) both}
  @keyframes pop{from{transform:scale(0)}}

  :is(.grid,.assets,.capsules,.modules,.timeline,.legend)>:nth-child(2){animation-delay:50ms}
  :is(.grid,.assets,.capsules,.modules,.timeline,.legend)>:nth-child(3){animation-delay:100ms}
  :is(.grid,.assets,.capsules,.modules,.timeline,.legend)>:nth-child(4){animation-delay:150ms}
  :is(.grid,.assets,.capsules,.modules,.timeline,.legend)>:nth-child(5){animation-delay:200ms}
  :is(.grid,.assets,.capsules,.modules,.timeline,.legend)>:nth-child(n+6){animation-delay:250ms}
  .bar span{animation:grow .7s cubic-bezier(.4,0,.2,1) both;transform-origin:left}

  #pw-dot{transition:none}
}
